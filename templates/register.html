{% extends "base.html" %}
{% block title %}Create your account — Marketplace{% endblock %}

{% block content %}

<div class="form-card">
  <h1>Create your account</h1>
  <p style="color:var(--text-muted); font-size:14px; margin:4px 0 20px;">
    Buy digital products, or register as a seller to list your own.
  </p>

  <form method="post">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password (min. 6 characters)</label>
      <input type="password" id="password" name="password" minlength="6" required>
    </div>

    <div class="field">
      <label>Account type</label>
      <div class="radio-row">
        <label><input type="radio" name="account_type" value="buyer" checked onchange="toggleSellerFields()"> Buyer only</label>
        <label><input type="radio" name="account_type" value="seller" onchange="toggleSellerFields()"> Seller</label>
        <label><input type="radio" name="account_type" value="both" onchange="toggleSellerFields()"> Both</label>
      </div>
    </div>

    <div id="seller-fields" style="display:none;">
      <div class="field">
        <label for="contact_platform">How should buyers contact you?</label>
        <select id="contact_platform" name="contact_platform">
          <option value="whatsapp">WhatsApp</option>
          <option value="telegram">Telegram</option>
        </select>
      </div>
      <div class="field">
        <label for="contact_value">Your WhatsApp number (with country code) or Telegram username</label>
        <input type="text" id="contact_value" name="contact_value" placeholder="e.g. 2348012345678 or @yourusername">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Create account</button>
  </form>
</div>

<script>
  function toggleSellerFields() {
    const wantsSeller = document.querySelector('input[name="account_type"]:checked').value !== 'buyer';
    document.getElementById('seller-fields').style.display = wantsSeller ? 'block' : 'none';
  }
</script>

{% endblock %}
