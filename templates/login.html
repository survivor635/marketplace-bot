{% extends "base.html" %}
{% block title %}Log in — Marketplace{% endblock %}

{% block content %}

<div class="form-card">
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="trust-line">New here? <a href="{{ url_for('register') }}" style="color:var(--teal);">Create an account</a></p>
</div>

{% endblock %}
