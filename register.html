{% extends "base_auth.html" %}
{% block title %}Create your account — Marketplace{% endblock %}

{% block content %}

<div class="auth-screen">
  <div class="auth-logo-box">M</div>
  <h1 class="auth-title">Create account</h1>
  <p class="auth-subtitle">Buy digital products, or register to sell your own</p>

  <div class="auth-card">
    <form method="post">
      <div class="auth-field">
        <span class="icon">👤</span>
        <input type="text" name="name" placeholder="Full name" required>
      </div>
      <div class="auth-field">
        <span class="icon">✉️</span>
        <input type="email" name="email" placeholder="Email" required>
      </div>
      <div class="auth-field">
        <span class="icon">🔒</span>
        <input type="password" name="password" placeholder="Password (min. 6 characters)" minlength="6" required>
      </div>

      <div class="auth-radio-row">
        <label><input type="radio" name="account_type" value="buyer" checked onchange="toggleSellerFields()"> Buyer</label>
        <label><input type="radio" name="account_type" value="seller" onchange="toggleSellerFields()"> Seller</label>
        <label><input type="radio" name="account_type" value="both" onchange="toggleSellerFields()"> Both</label>
      </div>

      <div id="seller-fields" style="display:none;">
        <div class="auth-field">
          <span class="icon">💬</span>
          <select name="contact_platform" style="flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px;">
            <option value="whatsapp">WhatsApp</option>
            <option value="telegram">Telegram</option>
          </select>
        </div>
        <div class="auth-field">
          <span class="icon">📞</span>
          <input type="text" name="contact_value" placeholder="WhatsApp number or @telegram username">
        </div>
      </div>

      <button type="submit" class="auth-submit">Create account</button>
    </form>
  </div>

  <div class="auth-links">
    <a href="{{ url_for('login') }}">Already have an account? Log in</a>
  </div>
</div>

<script>
  function toggleSellerFields() {
    const wantsSeller = document.querySelector('input[name="account_type"]:checked').value !== 'buyer';
    document.getElementById('seller-fields').style.display = wantsSeller ? 'block' : 'none';
  }
</script>

{% endblock %}
