<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Marketplace{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wordmark">
      <span class="wordmark-main">Marketplace</span>
      <span class="wordmark-sub">DIGITAL GOODS</span>
    </div>
  </header>

  <main class="main-with-tabbar">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-stack">
          {% for message in messages %}
            <div class="flash-note">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <nav class="tab-bar">
    <a href="{{ url_for('feed') }}" class="tab-item {{ 'active' if request.endpoint == 'feed' }}">
      <span class="tab-icon">🏠</span><span>Home</span>
    </a>
    <a href="{{ url_for('home') }}" class="tab-item {{ 'active' if request.endpoint in ['home', 'product_detail'] }}">
      <span class="tab-icon">🛒</span><span>Market</span>
    </a>
    <a href="{{ url_for('people') }}" class="tab-item {{ 'active' if request.endpoint == 'people' }}">
      <span class="tab-icon">👥</span><span>People</span>
    </a>
    <a href="{{ url_for('menu_page') }}" class="tab-item {{ 'active' if request.endpoint == 'menu_page' }}">
      <span class="tab-icon">☰</span><span>Menu</span>
    </a>
  </nav>
</body>
</html>
