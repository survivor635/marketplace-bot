{% extends "base.html" %}
{% block title %}{{ 'Edit listing' if product else 'New listing' }} — Marketplace{% endblock %}

{% block content %}

<div class="form-card">
  <h1>{{ 'Edit listing' if product else 'Add a new listing' }}</h1>
  <form method="post">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ product.title if product else '' }}" required>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <input type="text" id="description" name="description" value="{{ product.description if product else '' }}">
    </div>
    <div class="field">
      <label for="price">Price (₦)</label>
      <input type="number" id="price" name="price" min="1" step="0.01" value="{{ product.price if product else '' }}" required>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save changes' if product else 'Add listing' }}</button>
  </form>
  <p class="trust-line"><a href="{{ url_for('dashboard') }}" style="color:var(--teal);">&larr; Back to dashboard</a></p>
</div>

{% endblock %}
